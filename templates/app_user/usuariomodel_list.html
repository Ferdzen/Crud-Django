<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Usuários</title>

    <link rel="stylesheet" href="{% static 'css/usuario_list.css' %}">
</head>
<body>

<div class="container">

    <div class="top-bar">
        <a href="/">← Voltar</a>
        <div class="title">Usuários</div>
        <a href="{% url 'usuario-create' %}" class="btn btn-primary">
            + Novo Usuário
        </a>
    </div>

    <ul class="user-list">
        {% for usuario in object_list %}
            <li class="user-item">
                <div class="user-info">
                    <strong>#{{ usuario.id }}</strong> — {{ usuario.nome }}
                </div>

                <div class="actions">
                    <a href="{% url 'usuario-detail' pk=usuario.id %}">Ver</a>
                    <a href="{% url 'usuario-update' pk=usuario.id %}">Editar</a>
                    <a href="{% url 'usuario-delete' pk=usuario.id %}" class="btn-danger">Excluir</a>
                </div>
            </li>
        {% empty %}
            <li>Nenhum usuário cadastrado.</li>
        {% endfor %}
    </ul>

</div>

</body>
</html>
