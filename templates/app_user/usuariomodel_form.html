<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    {% if request.resolver_match.url_name == 'usuario-create' %}
        <title>Cadastrar Usuário</title>
    {% else %}
        <title>Editar Usuário</title>
    {% endif %}

    <link rel="stylesheet" href="{% static 'css/usuario_form.css' %}">
</head>
<body>

<div class="container">

    <div class="top-bar">
        <a href="{% url 'usuario-list' %}">← Voltar</a>

        <div class="title">
            {% if request.resolver_match.url_name == 'usuario-create' %}
                Cadastrar Usuário
            {% else %}
                Editar Usuário
            {% endif %}
        </div>
    </div>

    <form action="." method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="actions">
            <button type="submit" class="btn btn-primary">
                Salvar
            </button>

            <button type="button"
                    class="btn btn-secondary"
                    onclick="location.href = '{% url 'usuario-list' %}'">
                Cancelar
            </button>
        </div>
    </form>

</div>

</body>
</html>
